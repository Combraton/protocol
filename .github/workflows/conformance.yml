name: Conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    name: Runner, reference provider and fixtures (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned at setup
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        id: build
        run: cargo build --workspace --locked
      - name: Unit tests (includes encoding vectors in the reference provider)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --workspace --locked
      - name: Runner self-test against encoding vectors
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./target/debug/combraton-conformance self-test
      - name: Check fixtures
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./target/debug/combraton-conformance check-fixtures
      - name: Run suite against the reference provider
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./target/debug/combraton-conformance run --participant conformance/participants/reference-provider.json
      - name: Every negative fixture fails its declared mutants
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./target/debug/combraton-conformance check-mutants --participant conformance/participants/reference-provider.json
      - name: Run suite against the reference provider over the Unix-socket binding
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./target/debug/combraton-conformance run --participant conformance/participants/reference-provider-unix.json --out conformance/results/reference-unix
      - name: Socket fixtures fail their declared mutants
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./target/debug/combraton-conformance check-mutants --participant conformance/participants/reference-provider-unix.json --out conformance/results/reference-unix
      - name: Run suite against the independent Python implementation (built from documents only)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: ./target/debug/combraton-conformance run --participant conformance/participants/independent-python-core.json --out conformance/results/independent-python-core
      - name: Build the accepted M5 release (6ed4727) for compatibility checks
        id: pinned
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 conformance/scripts/build_pinned.py m5
      - name: Older clients — the accepted M5 fixture set, unmodified, against the current reference provider (stdio)
        if: ${{ !cancelled() && steps.pinned.outcome == 'success' }}
        run: ./target/debug/combraton-conformance run --participant conformance/participants/reference-provider.json --fixtures target/pinned-m5/src/conformance/fixtures --out conformance/results/compat/m5-fixtures-reference
      - name: Older clients — the accepted M5 fixture set, unmodified, against the current reference provider (Unix socket)
        if: ${{ !cancelled() && steps.pinned.outcome == 'success' }}
        run: ./target/debug/combraton-conformance run --participant conformance/participants/reference-provider-unix.json --fixtures target/pinned-m5/src/conformance/fixtures --out conformance/results/compat/m5-fixtures-reference-unix
      - name: Older clients — the accepted M5 fixture set, unmodified, against the independent Python implementation
        if: ${{ !cancelled() && steps.pinned.outcome == 'success' }}
        run: ./target/debug/combraton-conformance run --participant conformance/participants/independent-python-core.json --fixtures target/pinned-m5/src/conformance/fixtures --out conformance/results/compat/m5-fixtures-independent
      - name: Older provider — compatibility fixtures against the pinned M5 reference provider (stdio)
        if: ${{ !cancelled() && steps.pinned.outcome == 'success' }}
        run: ./target/debug/combraton-conformance run --participant conformance/participants/pinned/m5-reference-provider.json --filter compat. --out conformance/results/compat/pinned-m5-provider
      - name: Older provider — compatibility fixtures against the pinned M5 reference provider (Unix socket)
        if: ${{ !cancelled() && steps.pinned.outcome == 'success' }}
        run: ./target/debug/combraton-conformance run --participant conformance/participants/pinned/m5-reference-provider-unix.json --filter compat. --out conformance/results/compat/pinned-m5-provider-unix
      - name: Different OS user is refused on the Unix socket (root client through sudo)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 conformance/scripts/peer_user_check.py --require --out conformance/results/peer-user
      - name: The different-user check detects a provider without the peer check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 conformance/scripts/peer_user_check.py --require --mutant skip-peer-check --expect accepted --out conformance/results/peer-user-mutant
      - name: Deterministic race regression passes every run on the correct provider
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 conformance/scripts/repeat_fixture.py --participant conformance/participants/reference-provider-unix.json --fixture socket.subscription-recheck-race-regression --runs 20 --out conformance/results/race-repeat/correct
      - name: Deterministic race regression fails every run on the recheck-outside-lock mutant for the intended reason
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 conformance/scripts/repeat_fixture.py --participant conformance/participants/reference-provider-unix.json --fixture socket.subscription-recheck-race-regression --mutant recheck-outside-lock --runs 20 --out conformance/results/race-repeat/recheck-outside-lock
      - name: Summarize outcomes
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          print("| Result | Outcomes |\n|---|---|")
          for path in sorted(pathlib.Path("conformance/results").glob("**/manifest.json")):
              if "mutants" in path.parts:
                  continue
              summary = json.loads(path.read_text()).get("summary", {})
              print(f"| {path.parent} | " + ", ".join(f"{k}: {v}" for k, v in sorted(summary.items())) + " |")
          for path in sorted(pathlib.Path("conformance/results").glob("**/mutants.json")):
              data = json.loads(path.read_text())
              survived = [r["mutant"] for r in data["results"] if not r.get("as_intended", r["killed"])]
              print(f"| {path} | all killed as intended: {data['all_killed']}; exceptions: {', '.join(sorted(set(survived))) or 'none'} |")
          for path in sorted(pathlib.Path("conformance/results").glob("race-repeat/*/summary.json")):
              data = json.loads(path.read_text())
              print(f"| {path} | {data['intended_runs']}/{data['runs']} runs as intended |")
          for path in sorted(pathlib.Path("conformance/results").glob("*/manifest.json")):
              limits = json.loads(path.read_text()).get("coverage_limits", [])
              if limits:
                  print(f"| {path.parent} coverage limits | " + "; ".join(f"{l['fixture']}: {l['reason']}" for l in limits) + " |")
          for path in sorted(pathlib.Path("conformance/results").glob("peer-user*/result.json")):
              print(f"| {path} | {json.loads(path.read_text())['outcome']} |")
          PY
      - name: Upload result manifests, transcripts and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-results-${{ matrix.os }}
          path: conformance/results/
          if-no-files-found: warn
          retention-days: 30

  bundle:
    name: Source bundle from a fresh extraction (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned at setup
        with:
          persist-credentials: false
      - name: Install pinned toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the source bundle twice from this commit and require identical bytes
        run: |
          version=$(python3 -c 'import re;print(re.search(r"^version = \"([^\"]+)\"", open("Cargo.toml").read(), re.M).group(1))')
          python3 scripts/release.py bundle --commit HEAD --version "$version" --out "$RUNNER_TEMP/dist-a"
          python3 scripts/release.py bundle --commit HEAD --version "$version" --out "$RUNNER_TEMP/dist-b"
          cmp "$RUNNER_TEMP/dist-a/combraton-protocol-$version-source.tar.gz" "$RUNNER_TEMP/dist-b/combraton-protocol-$version-source.tar.gz"
          echo "version=$version" >> "$GITHUB_ENV"
      - name: Consumer path from the extracted bundle (no Git metadata), full checks
        run: python3 scripts/release.py verify-bundle --archive "$RUNNER_TEMP/dist-a/combraton-protocol-$version-source.tar.gz" --work "$RUNNER_TEMP/extracted" --full
      - name: Upload the bundle verification record
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-verification-${{ matrix.os }}
          path: ${{ runner.temp }}/extracted/verify-bundle.json
          if-no-files-found: warn
          retention-days: 30

  crosscheck:
    name: Non-Rust encoding cross-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned at setup
        with:
          persist-credentials: false
      - name: Python rfc8785 cross-check
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet rfc8785==0.1.4
          PYTHONPATH=conformance/crosscheck/src "$RUNNER_TEMP/venv/bin/python" conformance/crosscheck/generate_encoding_vectors.py --check conformance/vectors/encoding.json
      - name: Node canonicalize cross-check
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/jcs" canonicalize@5.0.0
          node conformance/crosscheck/crosscheck_encoding_vectors.mjs "$RUNNER_TEMP/jcs/node_modules/canonicalize/lib/canonicalize.js" conformance/vectors/encoding.json
